<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>How EMU works: the identity provider controls the managed users inside a new enterprise</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
  </defs>
  <!-- IdP -->
  <rect x="10" y="90" width="250" height="240" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="135" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#0550ae">Identity Provider</text>
  <text x="135" y="158" text-anchor="middle" font-size="16" fill="#1f2328">Entra ID · Okta · PingFederate</text>
  <line x1="40" y1="176" x2="230" y2="176" stroke="#54aeff"/>
  <text x="135" y="206" text-anchor="middle" font-size="16" fill="#1f2328">Users &amp; groups</text>
  <text x="135" y="232" text-anchor="middle" font-size="16" fill="#1f2328">Usernames &amp; one email</text>
  <text x="135" y="258" text-anchor="middle" font-size="16" fill="#1f2328">Lifecycle (join / move / leave)</text>
  <text x="135" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#0550ae">SOURCE OF TRUTH</text>
  <!-- arrows -->
  <line x1="262" y1="170" x2="368" y2="170" stroke="#0969da" stroke-width="3" marker-end="url(#a)"/>
  <text x="315" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#0550ae">SCIM</text>
  <text x="315" y="192" text-anchor="middle" font-size="15" fill="#57606a">provisioning</text>
  <line x1="368" y1="250" x2="262" y2="250" stroke="#0969da" stroke-width="3" marker-end="url(#a)"/>
  <text x="315" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#0550ae">SAML / OIDC</text>
  <text x="315" y="272" text-anchor="middle" font-size="15" fill="#57606a">sign-in</text>
  <!-- Enterprise -->
  <rect x="372" y="20" width="560" height="390" rx="16" fill="#f6f8fa" stroke="#1f2328" stroke-width="2.5"/>
  <text x="652" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">New EMU enterprise</text>
  <text x="652" y="76" text-anchor="middle" font-size="16" fill="#57606a">Enterprise boundary · private &amp; internal repositories only</text>
  <rect x="392" y="96" width="520" height="52" rx="10" fill="#fff8c5" stroke="#bf8700"/>
  <text x="652" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Managed users  <tspan font-weight="400">NAME_SHORTCODE</tspan></text>
  <text x="652" y="138" text-anchor="middle" font-size="15" fill="#57606a">+ setup user SHORTCODE_admin (non-SCIM · break-glass)</text>
  <rect x="392" y="166" width="250" height="228" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="517" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#0550ae">Organization A</text>
  <rect x="408" y="206" width="218" height="34" rx="8" fill="#ddf4ff"/><text x="517" y="228" text-anchor="middle" font-size="16">Team ⇄ IdP group</text>
  <rect x="408" y="250" width="218" height="34" rx="8" fill="#ddf4ff"/><text x="517" y="272" text-anchor="middle" font-size="16">Team ⇄ IdP group</text>
  <rect x="408" y="300" width="100" height="34" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="458" y="322" text-anchor="middle" font-size="15">internal</text>
  <rect x="518" y="300" width="108" height="34" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="572" y="322" text-anchor="middle" font-size="15">private</text>
  <text x="517" y="372" text-anchor="middle" font-size="15" fill="#57606a">repos · Actions · GHAS</text>
  <rect x="662" y="166" width="250" height="228" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="787" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#0550ae">Organization B</text>
  <rect x="678" y="206" width="218" height="34" rx="8" fill="#ddf4ff"/><text x="787" y="228" text-anchor="middle" font-size="16">Team ⇄ IdP group</text>
  <rect x="678" y="250" width="218" height="34" rx="8" fill="#ddf4ff"/><text x="787" y="272" text-anchor="middle" font-size="16">Team ⇄ IdP group</text>
  <rect x="678" y="300" width="100" height="34" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="728" y="322" text-anchor="middle" font-size="15">internal</text>
  <rect x="788" y="300" width="108" height="34" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="842" y="322" text-anchor="middle" font-size="15">private</text>
  <text x="787" y="372" text-anchor="middle" font-size="15" fill="#57606a">repos · Actions · GHAS</text>
  <!-- public -->
  <line x1="934" y1="215" x2="994" y2="215" stroke="#cf222e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <text x="964" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#cf222e">✕</text>
  <rect x="998" y="120" width="195" height="190" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1095" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Public GitHub</text>
  <text x="1095" y="188" text-anchor="middle" font-size="16" fill="#57606a">read-only access</text>
  <text x="1095" y="218" text-anchor="middle" font-size="16" fill="#cf222e">no public repos / gists</text>
  <text x="1095" y="240" text-anchor="middle" font-size="16" fill="#cf222e">no outside collab.</text>
  <text x="1095" y="272" text-anchor="middle" font-size="16" fill="#57606a">→ use a separate</text>
  <text x="1095" y="292" text-anchor="middle" font-size="16" fill="#57606a">personal account</text>
</svg>
